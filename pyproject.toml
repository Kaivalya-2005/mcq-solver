[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcq-solver"
version = "0.1.0"
description = "MCQ Solver using TF-IDF baseline and advanced ML models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MCQ Solver Team"}]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "datasets>=2.10.0",
    "accelerate>=0.20.0",
    "sentence-transformers>=2.2.0",
    "huggingface_hub>=0.16.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
mcq-baseline = "src.stage1_baseline:run_baseline"

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
